name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            output="dist/scraper-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/rajbahakdanyu/scraper/cmd.version=${GITHUB_REF_NAME#v}" -o "$output" ./cmd/scraper
          done

      - name: Compress binaries
        run: |
          cd dist
          for f in scraper-*; do
            tar -czf "${f}.tar.gz" "$f"
          done
          # Cover the published archives as well as the binaries inside them.
          sha256sum scraper-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  # The GUI links each platform's native webview through CGO, so it builds on
  # native runners and attaches to the release the job above created.
  gui:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: scraper-gui-darwin-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: scraper-gui-windows-amd64.zip
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            asset: scraper-gui-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
            asset: scraper-gui-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          tags=()
          if [ -n "${{ matrix.tags }}" ]; then tags=(-tags "${{ matrix.tags }}"); fi
          wails build -clean -trimpath -platform "${{ matrix.platform }}" "${tags[@]}"

      - name: Package
        run: |
          mkdir -p ../dist
          asset="../dist/${{ matrix.asset }}"
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent build/bin/scraper-gui.app "$asset" ;;
            Windows) 7z a "$asset" ./build/bin/scraper-gui.exe ;;
            *) tar -czf "$asset" -C build/bin scraper-gui ;;
          esac
          cd ../dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
