name: Release

# Run from Actions → Release → Run workflow on main. The version is picked from
# the Conventional Commits since the last vX.Y.Z tag (see
# .github/scripts/next-version.sh); everything is built first and the tag and
# release are only created once every build succeeds.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commits since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Build everything but do not tag or publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      previous: ${{ steps.next.outputs.previous }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases run from main, not $REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the version bump
          persist-credentials: false

      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/next-version.sh

      - name: Summary
        env:
          PREVIOUS: ${{ steps.next.outputs.previous }}
          BUMP: ${{ steps.next.outputs.bump }}
          TAG: ${{ steps.next.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### ${PREVIOUS:-none} → $TAG ($BUMP)"
            if [ "$DRY_RUN" = true ]; then
              echo "Dry run: builds are attached to this run as artifacts; nothing is tagged or published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds never restore caches other workflows could have written.
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            output="dist/scraper-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/rajbahakdanyu/scraper/cmd.version=${VERSION}" -o "$output" ./cmd/scraper
          done

      - name: Compress binaries
        run: |
          cd dist
          for f in scraper-*; do
            tar -czf "${f}.tar.gz" "$f"
          done
          # Cover the published archives as well as the binaries inside them.
          sha256sum scraper-* > checksums.txt
          find . -maxdepth 1 -name 'scraper-*' ! -name '*.tar.gz' -delete

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        run: |
          manifest=browser-extension/manifest.json
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" "$manifest"
          asset="scraper-tab-export-${VERSION}.xpi"
          mkdir -p dist
          (cd browser-extension && zip -X -r "../dist/${asset}" manifest.json popup.html ./*.mjs)
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: dist/
          if-no-files-found: error

  # The GUI links each platform's native webview through CGO, so it builds on
  # native runners.
  gui:
    needs: version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: scraper-gui-darwin-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: scraper-gui-windows-amd64.zip
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: scraper-gui-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            asset: scraper-gui-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.platform }}
      VERSION: ${{ needs.version.outputs.version }}
      WAILS_EXP_USE_WAKE: "1"
    defaults:
      run:
        shell: bash
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gui/go.mod
          cache: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: gui/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: gui/frontend/.nvmrc
          package-manager-cache: false

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Test
        run: go test ./...

      - name: Set version
        run: |
          sed -i.bak -E "s/^(  version: ).*/\1${VERSION}/" wails.yaml
          rm wails.yaml.bak
          grep -qx "  version: ${VERSION}" wails.yaml

      - name: Build
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 build -targets "$TARGET"

      # Signing is optional: each platform signs only when its credentials
      # are configured, so forks and unsigned releases keep working.
      - name: Check signing credentials
        id: signing
        env:
          MACOS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
          NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
          WINDOWS: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_CERTIFICATE_PROFILE != '' }}
        run: |
          {
            echo "macos=$MACOS"
            echo "notarize=$NOTARIZE"
            echo "windows=$WINDOWS"
          } >> "$GITHUB_OUTPUT"
          if { [ "$RUNNER_OS" = macOS ] && [ "$MACOS" != true ]; } || { [ "$RUNNER_OS" = Windows ] && [ "$WINDOWS" != true ]; }; then
            echo "::notice::No signing credentials for $RUNNER_OS; publishing an unsigned build."
          fi

      - name: Sign (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$MACOS_SIGN_IDENTITY" build/bin/scraper-gui.app
          codesign --verify --strict --verbose=2 build/bin/scraper-gui.app

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/bin/scraper-gui.app "$submission"
          xcrun notarytool submit "$submission" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          # Fails unless Apple accepted the submission.
          xcrun stapler staple build/bin/scraper-gui.app
          spctl --assess --type execute --verbose=2 build/bin/scraper-gui.app

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Sign (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\gui\build\bin\scraper-gui.exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Package
        run: |
          mkdir -p ../dist
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent build/bin/scraper-gui.app "../dist/$ASSET" ;;
            Windows) 7z a "../dist/$ASSET" ./build/bin/scraper-gui.exe ;;
            *) tar -czf "../dist/$ASSET" -C build/bin scraper-gui ;;
          esac
          cd ../dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, cli, extension, gui]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes read the commits since the previous tag
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: node .github/scripts/changelog.mjs notes "$PREVIOUS" "$GITHUB_SHA" "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Creates the tag on the commit this run built.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*

  # Releases made with GITHUB_TOKEN don't trigger other workflows, so rebuild
  # the docs here to pick up the new version, downloads, and changelog.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
