name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            output="dist/scraper-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/rajbahakdanyu/scraper/cmd.version=${GITHUB_REF_NAME#v}" -o "$output" ./cmd/scraper
          done

      - name: Compress binaries
        run: |
          cd dist
          sha256sum scraper-* > checksums.txt
          for f in scraper-*; do
            tar -czf "${f}.tar.gz" "$f"
          done

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
