name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds never restore caches other workflows could have written.
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            output="dist/scraper-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/rajbahakdanyu/scraper/cmd.version=${GITHUB_REF_NAME#v}" -o "$output" ./cmd/scraper
          done

      - name: Compress binaries
        run: |
          cd dist
          for f in scraper-*; do
            tar -czf "${f}.tar.gz" "$f"
          done
          # Cover the published archives as well as the binaries inside them.
          sha256sum scraper-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/checksums.txt

  # The GUI links each platform's native webview through CGO, so it builds on
  # native runners and attaches to the release the job above created.
  gui:
    needs: release
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: scraper-gui-darwin-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: scraper-gui-windows-amd64.zip
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            asset: scraper-gui-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
            asset: scraper-gui-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
      PLATFORM: ${{ matrix.platform }}
      TAGS: ${{ matrix.tags }}
    defaults:
      run:
        shell: bash
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gui/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          tags=()
          if [ -n "$TAGS" ]; then tags=(-tags "$TAGS"); fi
          wails build -clean -trimpath -platform "$PLATFORM" "${tags[@]}"

      - name: Package
        run: |
          mkdir -p ../dist
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent build/bin/scraper-gui.app "../dist/$ASSET" ;;
            Windows) 7z a "../dist/$ASSET" ./build/bin/scraper-gui.exe ;;
            *) tar -czf "../dist/$ASSET" -C build/bin scraper-gui ;;
          esac
          cd ../dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "../dist/$ASSET" "../dist/$ASSET.sha256" --clobber
