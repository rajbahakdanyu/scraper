name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds never restore caches other workflows could have written.
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            output="dist/scraper-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/rajbahakdanyu/scraper/cmd.version=${GITHUB_REF_NAME#v}" -o "$output" ./cmd/scraper
          done

      - name: Compress binaries
        run: |
          cd dist
          for f in scraper-*; do
            tar -czf "${f}.tar.gz" "$f"
          done
          # Cover the published archives as well as the binaries inside them.
          sha256sum scraper-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/checksums.txt

  extension:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        run: |
          version=$(jq -er '.version' browser-extension/manifest.json)
          asset="scraper-tab-export-${version}.xpi"
          mkdir -p dist
          (cd browser-extension && zip -X -r "../dist/${asset}" manifest.json popup.html ./*.mjs)
          cd dist
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --clobber

  # The GUI links each platform's native webview through CGO, so it builds on
  # native runners and attaches to the release the job above created.
  gui:
    needs: release
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: scraper-gui-darwin-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: scraper-gui-windows-amd64.zip
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            asset: scraper-gui-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
            asset: scraper-gui-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
      PLATFORM: ${{ matrix.platform }}
      TAGS: ${{ matrix.tags }}
    defaults:
      run:
        shell: bash
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gui/go.mod
          cache: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: gui/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: gui/frontend/.nvmrc
          package-manager-cache: false

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          tags=()
          if [ -n "$TAGS" ]; then tags=(-tags "$TAGS"); fi
          wails build -clean -trimpath -platform "$PLATFORM" "${tags[@]}"

      # Signing is optional: each platform signs only when its credentials
      # are configured, so forks and unsigned releases keep working.
      - name: Check signing credentials
        id: signing
        env:
          MACOS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
          NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
          WINDOWS: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_CERTIFICATE_PROFILE != '' }}
        run: |
          {
            echo "macos=$MACOS"
            echo "notarize=$NOTARIZE"
            echo "windows=$WINDOWS"
          } >> "$GITHUB_OUTPUT"
          if { [ "$RUNNER_OS" = macOS ] && [ "$MACOS" != true ]; } || { [ "$RUNNER_OS" = Windows ] && [ "$WINDOWS" != true ]; }; then
            echo "::notice::No signing credentials for $RUNNER_OS; publishing an unsigned build."
          fi

      - name: Sign (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$MACOS_SIGN_IDENTITY" build/bin/scraper-gui.app
          codesign --verify --strict --verbose=2 build/bin/scraper-gui.app

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/bin/scraper-gui.app "$submission"
          xcrun notarytool submit "$submission" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          # Fails unless Apple accepted the submission.
          xcrun stapler staple build/bin/scraper-gui.app
          spctl --assess --type execute --verbose=2 build/bin/scraper-gui.app

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Sign (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\gui\build\bin\scraper-gui.exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Package
        run: |
          mkdir -p ../dist
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent build/bin/scraper-gui.app "../dist/$ASSET" ;;
            Windows) 7z a "../dist/$ASSET" ./build/bin/scraper-gui.exe ;;
            *) tar -czf "../dist/$ASSET" -C build/bin scraper-gui ;;
          esac
          cd ../dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "../dist/$ASSET" "../dist/$ASSET.sha256" --clobber
