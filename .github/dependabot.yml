version: 2
updates:
  - package-ecosystem: "gomod"
    # gui replaces the root module, so both go.mod files must move together.
    directories:
      - "/"
      - "/gui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/gui/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # svelte-check currently supports TypeScript 5 and 6, but not 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      frontend:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      docs:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
