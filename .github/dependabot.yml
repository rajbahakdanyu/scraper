version: 2
updates:
  - package-ecosystem: "gomod"
    # gui replaces the root module, so both go.mod files must move together.
    directories:
      - "/"
      - "/gui"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
