# yaml-language-server: $schema=https://v3.wails.io/schemas/wails.v3.json
version: 3
project:
  name: scraper-gui
  product_name: Scraper
  identifier: com.rajbahakdanyu.scraper-gui
  version: 0.1.0
  binary_name: scraper-gui
frontend:
  directory: frontend
  install: [pnpm, install, --frozen-lockfile]
  build: [pnpm, run, build]
  dev: [pnpm, run, dev]
  output: frontend/dist
  bindings:
    typescript: true
    interfaces: false
    output: bindings
    models_filename: models
    index_filename: index
    time_type: string
build:
  output: build/bin
  trim_path: true
  strip: true
dev:
  debounce_ms: 250
  watch: ['**/*.go', wails.yaml]
  exclude: [.git, .wails, build, frontend]
targets:
  windows/amd64: {}
  darwin/amd64: {}
  darwin/arm64: {}
  darwin/universal: {}
  linux/amd64: {}
  linux/arm64: {}
